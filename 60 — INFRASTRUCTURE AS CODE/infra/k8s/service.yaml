apiVersion: v1
kind: Service
metadata:
  name: vyron-core-service
  namespace: vyron-system
  labels:
    app.kubernetes.io/name: vyron-core
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP
  selector:
    app.kubernetes.io/name: vyron-core
---
apiVersion: v1
kind: Service
metadata:
  name: vyron-headless-service
  namespace: vyron-system
  labels:
    app.kubernetes.io/name: vyron-core
spec:
  clusterIP: None
  ports:
    - name: http
      port: 8080
      targetPort: 8080
  selector:
    app.kubernetes.io/name: vyron-core
