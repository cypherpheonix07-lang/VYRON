apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vyron-core-ingress
  namespace: vyron-system
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
spec:
  tls:
    - hosts:
        - app.vyron.ai
        - api.vyron.ai
      secretName: vyron-tls-cert
  rules:
    - host: app.vyron.ai
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: vyron-core-service
                port:
                  number: 80
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: vyron-core-hpa
  namespace: vyron-system
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: vyron-core-deployment
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
