# VYRON Supabase Declarative Configuration
# Governed by: Zero-Fiction Architecture Law, Zero Raw SQL Mandate, RLS Multi-Tenancy

[project]
id = "proj-vyron-fintech"
name = "VYRON Autonomous Architecture Platform"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = true
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[auth]
enabled = true
site_url = "http://localhost:8080"
additional_redirect_urls = ["https://app.vyron.ai"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true

[storage]
enabled = true
file_size_limit = "50MiB"

[analytics]
enabled = false
